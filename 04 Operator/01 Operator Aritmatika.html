<!DOCTYPE html>
<html>
<head>
    <title>Penggunaan Operator Aritmatika</title>
</head>

<body>
    <h1>Penggunaan Operator Aritmatika</h1>
    <script>
        let x = 10;
        let y = 5;
        let addition = x + y;
        let substraction = x - y;
        let multiplication = x * y;
        let division = x / y;
        let modulus = x % y;
        document.write("Hasil Penjumlahan: " + addition + "<br>");
        document.write("Hasil Pengurangan: " + substraction + "<br>");
        document.write("Hasil Perkalian: " + multiplication + "<br>");
        document.write("Hasil Pembagian: " + division + "<br>");
        document.write("Sisa Pembagian: " + modulus + "<br>");
        let num = 5;
        num++; // increment
        document.write("Nilai Setelah Increment: " + num + "<br>");
        let anotherNum = 8;
        anotherNum--; // increment
        document.write("Nilai Setelah Decrement: " + anotherNum + "<br>");
    </script>  
</body>
</html>
